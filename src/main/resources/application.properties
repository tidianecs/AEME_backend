spring.application.name=aeme_backend

#Server
server.port=8081
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/AEME

#Keycloak Configuration
keycloak.server-url=http://localhost:8080
keycloak.realm=AEME
keycloak.client-id=aeme-client
keycloak.client-secret=Zs8mVCfGPxDNykyuiG5PAzuMYliV3JR5

# PostgresSQL db configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aeme_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File upload config
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB